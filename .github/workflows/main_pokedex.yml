name: Build and Deploy Angular App to Azure Web App - pokedex

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: |
          cd source/pokedex-angular
          npm ci --ignore-scripts

      - name: Build Angular app
        run: |
          cd source/pokedex-angular
          npm run build -- --configuration production

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pokedex'
          slot-name: 'Production'
          package: 'source/pokedex-angular/dist/pokedex-angular'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_6BCA96D220C74A6B8895FFFE31C70978 }}